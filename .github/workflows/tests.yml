name: Python tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Compile
        run: python -m compileall -q fpt_rag main.py streamlit_app.py scripts
      - name: Unit tests
        run: pytest -q
